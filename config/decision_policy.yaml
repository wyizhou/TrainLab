schema_version: 1
one_primary_training_per_day: true
user_selects_start_clock_time: true

selection_order:
  - safety_stop_or_active_injury
  - explicit_user_plan_or_completed_activity
  - recovery_status
  - due_running_quality_or_long_run
  - strength_when_fully_configured
  - recent_climbing_pattern_with_recovery
  - easy_running_or_rest

running_load:
  baseline_complete_weeks: 4
  minimum_complete_weeks_for_progression: 3
  progression_requires_successful_weeks: 2
  maximum_weekly_volume_increase_fraction: 0.05
  forced_weekly_increase: false
  change_distance_frequency_or_intensity_dimensions_per_week: 1
  sudden_weekly_increase_over_fraction: 0.30
  sudden_increase_action: do_not_prescribe_and_flag
  insufficient_history_fallback:
    course_type: easy_run
    main_set_minutes: 30
    exact_zone_when_available: zone_2
    without_exact_zone: full_sentence_talk_test
  long_run:
    minimum_recent_completed_runs: 2
    initial_main_set_minutes: 60
    target_zone: zone_2
    increase_minutes_maximum: 5
    increase_requires_normal_48_hour_recovery: true
  quality_sessions_use_running_policy: true

recovery:
  adult_sleep_reference_minimum_hours: 7
  single_short_sleep_night_changes_plan_alone: false
  single_device_anomaly_changes_plan_alone: false
  independent_signals_required_to_downgrade_quality: 2
  independent_signal_examples:
    - repeated_short_sleep
    - sustained_resting_heart_rate_risk
    - user_reported_fatigue_or_soreness
    - incomplete_recent_session
    - unusually_high_recent_load
  explicit_not_recovered_downgrades_quality: true
  red_flag_or_acute_injury_action: rest_and_professional_care_message
  missing_or_stale_data_action: easy_talk_test_or_rest_with_data_warning

climbing:
  fixed_schedule_required: false
  recommend_from:
    - explicit_user_plan
    - supported_recent_weekly_pattern
  minimum_pattern_occurrences_on_matching_weekday: 3
  required_recovered_areas: [forearms, back, shoulders, core]
  output_prefix: 今日攀岩
  output_recovery_reason_sentences: 1
  forbidden_details: [duration, route, grade, sets, repetitions, technique_drill]

strength:
  policy_source: config/strength_policy.yaml
  recommendation_requires_enabled_policy: true
  recommendation_mode: movement_only
  history_or_e1rm_required: false
  equipment_increment_required: false
  avoid_when_forearm_back_or_shoulder_recovery_is_poor: true

feedback:
  no_reply_interpretation: no_new_issue_reported
  no_reply_is_medical_confirmation: false
  temporary_feeling_expiry_days: 7
  injury_remains_active_until_explicit_recovery_or_expiry_review: true
  only_explicit_long_term_language_changes_profile: true
