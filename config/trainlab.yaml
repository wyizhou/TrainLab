schema_version: 1
timezone: Asia/Singapore

paths:
  database: data.db
  health_workbook: source/Health.xlsx
  fit_directory: source/HealthFit
  state_directory: state
  log_directory: logs

sqlite:
  journal_mode: WAL
  busy_timeout_ms: 10000

sync:
  executable: rclone
  required_version: 1.74.4
  remote_path: "trainlab_drive:"
  poll_seconds: 300
  checksum: true
  update: true
  required_scope: drive.readonly
  require_custom_client_id: true
  google_sheet:
    remote_file: "Health Metrics_v5.xlsx"
    export_format: xlsx
  fit:
    remote_directory: HealthFit

ingest:
  poll_seconds: 15
  stability_seconds: 10
  parser_version: 1

schedule:
  morning: "09:00"
  evening: "20:00"
  missed_run_policy: skip

runner:
  primary: codex
  codex_executable: codex
  codex_home: state/codex_home
  reasoning_effort: medium
  timeout_seconds: 900

mail:
  mode: fake
  label: TrainLab
  language: zh-CN
  recipient: self
  gmail_config: config/gmail_mcp.yaml

context:
  rolling_days: 7
  details_per_sport: 2
  weekly_summaries: 8
  monthly_summaries: 12

watchdog:
  check_seconds: 60
  heartbeat_max_age_seconds: 420
  retry_count: 3
  retry_delay_seconds: 30
  services:
    drive_sync:
      heartbeat: state/heartbeats/drive_sync.json
      macos_label: com.trainlab.drive-sync
      linux_unit: trainlab-drive-sync.service
    ingest:
      heartbeat: state/heartbeats/ingest.json
      macos_label: com.trainlab.ingest
      linux_unit: trainlab-ingest.service

production:
  enabled: false
