schema_version: 2
enabled: true
mode: movement_only
description: >-
  Strength recommendations are selected only for their usefulness to running
  and climbing. They never depend on historical loads, e1RM, equipment
  increments, sets, repetitions, rest periods, or prescribed kilograms.
goal: running_and_climbing_support
structure: full_body

history_dependency:
  activity_history_required: false
  exercise_history_required: false
  weight_history_required: false
  e1rm_used: false

session_structure:
  minimum_exercises: 5
  maximum_exercises: 5
  required_movement_groups:
    - [squat, single_leg]
    - [hinge]
    - [pull]
    - [push]
    - [anti_rotation]

output:
  required_fields: [exercise, youtube_url, youtube_kind]
  forbidden_fields:
    - sets
    - repetitions
    - weight_kg
    - percent_1rm
    - set_rpe
    - rest_seconds
  use_host_resolved_youtube_only: true
  form_assessment_without_video_or_movement_sensor: false

recovery:
  avoid_same_day_as_running_quality_or_long_run: true
  avoid_when_forearm_back_or_shoulder_recovery_is_poor: true
  pain_or_acute_injury_stops_recommendation: true
