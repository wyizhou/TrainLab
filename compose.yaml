name: trainlab

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trainlab
      POSTGRES_USER: trainlab
      POSTGRES_PASSWORD: trainlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlab -d trainlab"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - trainlab-db:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      TRAINLAB_ENVIRONMENT: development
      TRAINLAB_DATABASE_URL: postgresql+psycopg://trainlab:trainlab@db:5432/trainlab
      TRAINLAB_PUBLIC_ORIGIN: http://localhost:8000
      TRAINLAB_TRUSTED_ORIGINS: '["http://localhost:8000","http://localhost:5173"]'
      TRAINLAB_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      TRAINLAB_SESSION_COOKIE_SECURE: "false"
      TRAINLAB_FRONTEND_DIST: /app/frontend-dist
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  test-db:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trainlab_test
      POSTGRES_USER: trainlab
      POSTGRES_PASSWORD: trainlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainlab -d trainlab_test"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      TRAINLAB_ENVIRONMENT: test
      TRAINLAB_DATABASE_URL: postgresql+psycopg://trainlab:trainlab@test-db:5432/trainlab_test
      TRAINLAB_PUBLIC_ORIGIN: http://testserver
      TRAINLAB_TRUSTED_ORIGINS: '["http://testserver"]'
      TRAINLAB_ALLOWED_HOSTS: '["testserver","localhost"]'
      TRAINLAB_SESSION_COOKIE_SECURE: "false"
      TRAINLAB_FRONTEND_DIST: /tmp/trainlab-no-frontend
    depends_on:
      test-db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "alembic downgrade base; alembic upgrade head; pytest",
      ]

volumes:
  trainlab-db:
