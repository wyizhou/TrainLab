name: trainlab-source

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: source

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest skills/_tests -q
      - name: Ruff
        run: ruff --config skills/_shared/ruff.toml check skills
      - name: Ruff format
        run: ruff format --check skills
      - name: Mypy
        run: mypy --config-file skills/_shared/mypy.ini skills
      - name: Compile
        run: python -m compileall -q skills
      - name: JSON and agent metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("skills").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("skills").rglob("*.yaml"):
              if not path.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"empty agent metadata: {path}")
          PY
      - name: Source and privacy boundaries
        run: |
          test -f AGENTS.md
          test -f requirements.txt
          test -f goal.module.md
          test -d skills
          test -d state
          test ! -e src
          test ! -e tests
          test ! -e index.py
          test ! -e requirements.lock
          git check-ignore -q goal.md
          git check-ignore -q credentials.json
          git check-ignore -q gcp-oauth.keys.json
          git check-ignore -q state/trainlab.db
          git check-ignore -q ../data-backup
      - name: Diff check
        working-directory: .
        run: git diff --check
