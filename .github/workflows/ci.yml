name: trainlab-source

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: source

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test
        run: python -m pytest
      - name: Repository quality
        run: python tools/verify_repository_quality.py all
      - name: Ruff
        run: ruff check src tests scripts tools index.py
      - name: Ruff format
        run: ruff format --check src tests scripts tools index.py
      - name: Mypy
        run: mypy src
      - name: Compile
        run: python -m compileall -q src scripts tools index.py
      - name: JSON schemas
        run: python tools/check_schemas.py
      - name: Shell syntax
        run: |
          for script in scripts/*.sh tools/*.sh; do
            [ -e "$script" ] || continue
            sh -n "$script"
          done
      - name: Source and privacy boundaries
        run: python tools/verify_source_layout.py
