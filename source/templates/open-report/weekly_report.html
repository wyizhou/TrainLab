<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body{margin:0;background:#f4f7f8;color:#173042;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{max-width:760px;margin:0 auto;background:#fff}.header{padding:30px 34px;background:#163b54;color:#fff}
    .content{padding:30px 34px}.section{margin:0 0 24px;padding:20px 22px;border:1px solid #d8e4e8;border-radius:12px}
    h1,h2{margin:0 0 8px}h1{font-size:25px}h2{font-size:19px;color:#163b54}.muted{color:#61717c}
  </style>
</head>
<body><main class="shell"><header class="header"><h1>{{ title }}</h1><div>{{ period }}</div></header>
<section class="content">{{ body_html }}</section></main></body></html>
