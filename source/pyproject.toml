[project]
name = "trainlab-source"
version = "0.1.0"
description = "Local-first Garmin training analysis runtime"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.5",
  "fitdecode==0.11.0",
  "garminconnect==0.3.9",
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "packaging==26.3",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.16.1",
  "types-jsonschema==4.25.1.20250822",
  "types-PyYAML==6.0.12.20250915",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These compatibility facades intentionally import the legacy Garmin mixin
# surface so existing monkeypatch seams continue to point at one implementation.
"src/garmin/activities.py" = ["F403", "F405"]
"src/garmin/health.py" = ["F403", "F405"]
"src/garmin/repository.py" = ["F403", "F405"]
"src/garmin/fit.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
explicit_package_bases = true
mypy_path = [".", "typings"]
follow_imports = "skip"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
