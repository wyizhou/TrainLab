document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"94fb347e-979f-4267-9833-7d3cf6067ca2\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html,body{margin:0;padding:0;background:#0A0F18;}\n  *{box-sizing:border-box;}\n  a{color:#5EA3E8;text-decoration:none;}\n  a:hover{color:#8FC1F2;text-decoration:underline;}\n  input,select,button,textarea{font-family:inherit;}\n  input:focus,select:focus,textarea:focus{outline:1px solid #4292E0;}\n  ::-webkit-scrollbar{width:10px;height:10px;}\n  ::-webkit-scrollbar-thumb{background:#243349;border-radius:6px;}\n  ::-webkit-scrollbar-track{background:transparent;}\n  nav.top-nav{scrollbar-width:none;}\n  nav.top-nav::-webkit-scrollbar{display:none;}\n  input[type=\"date\"]::-webkit-calendar-picker-indicator{filter:invert(.7);}\n  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}\n  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n  @keyframes shimmer{0%{opacity:.45}50%{opacity:1}100%{opacity:.45}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column;font-family:'Helvetica Neue',Helvetica,'PingFang SC','Microsoft YaHei',sans-serif;color:#E6EBF4;background:#0A0F18;font-size:14px;font-variant-numeric:tabular-nums;\">\n\n<!-- ======================= 登录页 ======================= -->\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-screen-label=\"登录页\" style=\"flex:1;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 900px 600px at 50% -10%, #13203A 0%, #0A0F18 60%);padding:24px;\">\n    <div style=\"width:400px;max-width:100%;\">\n      <div style=\"text-align:center;margin-bottom:28px;\">\n        <div style=\"display:inline-flex;align-items:center;gap:10px;\">\n          <div style=\"width:34px;height:34px;border-radius:8px;background:#4292E0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#06101E;\">TL<\u002Fdiv>\n          <div style=\"font-size:22px;font-weight:700;letter-spacing:1px;\">TrainLab<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:#8A94A8;margin-top:8px;font-size:13px;\">运动数据分析系统 · 原始数据存储 + AI 分析<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#121A28;border:1px solid #223049;border-radius:12px;padding:28px;\">\n        <div style=\"font-size:16px;font-weight:600;margin-bottom:18px;\">验证登录<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"font-size:12px;color:#8A94A8;\">用户名<\u002Flabel>\n            <input value=\"{{ loginUser }}\" sc-camel-on-change=\"{{ onLoginUser }}\" placeholder=\"请输入用户名\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:11px 12px;font-size:14px;width:100%;\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"font-size:12px;color:#8A94A8;\">密码<\u002Flabel>\n            <input type=\"password\" value=\"{{ loginPass }}\" sc-camel-on-change=\"{{ onLoginPass }}\" sc-camel-on-key-down=\"{{ onLoginKey }}\" placeholder=\"请输入密码\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:11px 12px;font-size:14px;width:100%;\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"font-size:12px;color:#8A94A8;\">验证码<\u002Flabel>\n            <div style=\"display:flex;gap:10px;\">\n              <input value=\"{{ captchaInput }}\" sc-camel-on-change=\"{{ onCaptchaInput }}\" sc-camel-on-key-down=\"{{ onLoginKey }}\" placeholder=\"输入右侧字符\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:11px 12px;font-size:14px;flex:1;min-width:0;\">\n              <div sc-camel-on-click=\"{{ refreshCaptcha }}\" title=\"点击刷新\" style=\"cursor:pointer;user-select:none;background:#0B1220;border:1px dashed #3A4E70;border-radius:8px;padding:9px 16px;font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:18px;letter-spacing:6px;color:#5EA3E8;font-style:italic;\">{{ captcha }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ loginErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"color:#E06060;font-size:12px;\">{{ loginErr }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ doLogin }}\" style=\"margin-top:6px;background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:15px;padding:12px;border-radius:8px;cursor:pointer;\">登 录<\u002Fbutton>\n          <div style=\"color:#5C687E;font-size:12px;text-align:center;\">演示账号:任意用户名 + 任意密码(≥4位)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ======================= 主应用 ======================= -->\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;\">\n\n  <!-- 顶栏 -->\n  <header style=\"display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;border-bottom:1px solid #1C2739;background:#0D1420;flex-shrink:0;\">\n    <div style=\"display:flex;align-items:center;gap:9px;flex-shrink:0;\">\n      <div style=\"width:26px;height:26px;border-radius:6px;background:#4292E0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#06101E;\">TL<\u002Fdiv>\n      <div style=\"font-weight:700;font-size:15px;letter-spacing:.5px;\">TrainLab<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ topNav }}\" hint-placeholder-val=\"{{ true }}\">\n      <nav class=\"top-nav\" data-vc=\"top-nav\" style=\"display:flex;gap:2px;margin-l ange=\"{{ onRenameText }}\" sc-camel-on-key-down=\"{{ ss.renameKey }}\" sc-camel-on-click=\"{{ stopClick }}\" style=\"background:#0B1220;border:1px solid #4292E0;color:#E6EBF4;border-radius:6px;padding:5px 8px;font-size:12.5px;width:100%;\">\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ ss.notRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"flex:1;min-width:0;\">\n                        <div style=\"font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ ss.name }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#5C687E;margin-top:2px;\">{{ ss.meta }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span sc-camel-on-click=\"{{ ss.startRename }}\" title=\"重命名\" style=\"color:#5C687E;font-size:12px;cursor:pointer;padding:2px 4px;\">✎<\u002Fspan>\n                      <span sc-camel-on-click=\"{{ ss.del }}\" title=\"删除\" style=\"color:#5C687E;font-size:12px;cursor:pointer;padding:2px 4px;\">✕<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:10.5px;color:#3A4457;padding:0 4px;line-height:1.6;\">衍生指标(TSS / CTL / ATL / TSB…)仅在 AI 回复中产出,系统不预计算。<\u002Fdiv>\n            <\u002Faside>\n          <\u002Fsc-if>\n\n          <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;height:100%;\">\n          <!-- 会话选择(平板) -->\n          <sc-if value=\"{{ showSessionSelect }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:8px;margin-bottom:10px;flex-shrink:0;\">\n              <sc-raw-select value=\"{{ curSessionId }}\" sc-camel-on-change=\"{{ pickSessionSel }}\" style=\"flex:1;background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:8px 10px;font-size:13px;\">\n                <sc-for list=\"{{ sessionItems }}\" as=\"ss\" hint-placeholder-count=\"2\">\n                  <option value=\"{{ ss.id }}\">{{ ss.name }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <button sc-camel-on-click=\"{{ newSession }}\" style=\"background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer;\">+ 新建<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"margin-bottom:14px;\">\n            <div style=\"font-size:19px;font-weight:700;margin-bottom:4px;\">{{ curSessionName }}<\u002Fdiv>\n            <div style=\"color:#8A94A8;font-size:13px;\">AI 读取已存储的原始数据进行分析 · TSS / CTL / ATL / TSB 等衍生指标仅在回复中产出<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 2px 16px;\">\n            <sc-for list=\"{{ messages }}\" as=\"msg\" hint-placeholder-count=\"2\">\n              <div style=\"{{ msg.wrapStyle }}\">\n                <div data-vc=\"{{ msg.vc }}\" style=\"{{ msg.bubbleStyle }}\">\n                  <sc-if value=\"{{ msg.typing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"display:inline-flex;gap:4px;padding:2px 0;\">\n                      <span style=\"width:6px;height:6px;border-radius:50%;background:#8A94A8;animation:blink 1s infinite;\"><\u002Fspan>\n                      <span style=\"width:6px;height:6px;border-radius:50%;background:#8A94A8;animation:blink 1s .2s infinite;\"><\u002Fspan>\n                      <span style=\"width:6px;height:6px;border-radius:50%;background:#8A94A8;animation:blink 1s .4s infinite;\"><\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fsc-if>\n                  {{ msg.body }}\n                  <!-- 图表卡片:加载 / 空 / 折叠 / 展开 四态 -->\n                  <sc-if value=\"{{ msg.hasChart }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div data-vc=\"chart-card\" style=\"margin-top:12px;background:#0B1220;border:1px solid #2A3A55;border-radius:10px;overflow:hidden;\">\n                      <sc-if value=\"{{ msg.cardLoading }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;animation:shimmer 1.4s infinite;\">\n                          <span style=\"display:inline-block;width:13px;height:13px;border:2px solid #4292E0;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;\"><\u002Fspan>\n                          <span style=\"font-size:12.5px;color:#8A94A8;\">正在读取原始数据并生成图表…<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ msg.cardEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"padding:14px;display:flex;gap:12px;align-items:flex-start;\">\n                          <span style=\"font-size:16px;color:#5C687E;\">▦<\u002Fspan>\n                          <div>\n                            <div style=\"font-size:13px;font-weight:600;color:#8A94A8;\">数据不足,无法生成图表<\u002Fdiv>\n                            <div style=\"font-size:12px;color:#5C687E;margin-top:4px;line-height:1.7;\">{{ msg.emptyReason }}<br>请扩大数据范围或勾选更多运动后重新提问。<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ msg.cardReady }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div sc-camel-on-click=\"{{ msg.toggle }}\" style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;\">\n                          <span style=\"color:#4292E0;font-size:13px;flex-shrink:0;\">📊<\u002Fspan>\n                          <span style=\"font-size:13px;font-weight:600;flex-shrink:0;\">{{ msg.chartTitle }}<\u002Fspan>\n                          <sc-if value=\"{{ msg.collapsed }}\" hint-placeholder-val=\"{{ true }}\">\n                            <span style=\"font-size:12px;color:#8A94A8;font-family:ui-monospace,'SF Mono',Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;\">{{ msg.cardSummary }}<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ msg.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"flex:1;\"><\u002Fspan>\n                          <\u002Fsc-if>\n                          <span style=\"color:#5C687E;font-size:12px;flex-shrink:0;\">{{ msg.expandLabel }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ msg.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"padding:4px 14px 14px;\">\n                            <div style=\"font-size:11px;color:#5C687E;margin-bottom:6px;\">Y:{{ msg.cardYLabel }} · X:日期<\u002Fdiv>\n                            <svg sc-camel-view-box=\"0 0 340 112\" style=\"width:100%;display:block;\">\n                              <line x1=\"44\" y1=\"10\" x2=\"44\" y2=\"88\" stroke=\"#243349\" stroke-width=\"1\"><\u002Fline>\n                              <line x1=\"44\" y1=\"88\" x2=\"332\" y2=\"88\" stroke=\"#243349\" stroke-width=\"1\"><\u002Fline>\n                              <line x1=\"44\" y1=\"49\" x2=\"332\" y2=\"49\" stroke=\"#1C2739\" stroke-width=\"0.6\"><\u002Fline>\n                              <line x1=\"44\" y1=\"10\" x2=\"332\" y2=\"10\" stroke=\"#1C2739\" stroke-width=\"0.6\"><\u002Fline>\n                              {{ msg.cardLabels }}\n                              <polyline points=\"{{ msg.chartPts }}\" fill=\"none\" stroke=\"#4292E0\" stroke-width=\"1.8\"><\u002Fpolyline>\n                            <\u002Fsvg>\n                            <sc-if value=\"{{ showCardRows }}\" hint-placeholder-val=\"{{ true }}\">\n                              <div style=\"display:flex;flex-direction:column;gap:4px;margin-top:10px;\">\n                                <sc-for list=\"{{ msg.chartItems }}\" as=\"ci\" hint-placeholder-count=\"3\">\n                                  <div style=\"display:flex;gap:10px;font-size:12px;font-family:ui-monospace,'SF Mono',Consolas,monospace;color:#8A94A8;\">\n                                    <span style=\"width:88px;color:#5C687E;\">{{ ci.date }}<\u002Fspan><span style=\"flex:1;color:#B8C2D4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ ci.name }}<\u002Fspan><span>{{ ci.val }}<\u002Fspan>\n                                  <\u002Fdiv>\n                                <\u002Fsc-for>\n                              <\u002Fdiv>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div data-vc=\"analysis-input\" style=\"border:1px solid #223049;background:#121A28;border-radius:14px;padding:12px 14px;margin-bottom:8px;flex-shrink:0;\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;\">\n              <span style=\"font-size:11px;color:#5C687E;\">数据范围<\u002Fspan>\n              <sc-for list=\"{{ rangeChips }}\" as=\"rc\" hint-placeholder-count=\"4\">\n                <div sc-camel-on-click=\"{{ rc.pick }}\" data-vc=\"{{ rc.vc }}\" style=\"{{ rc.style }}\">{{ rc.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <div sc-camel-on-click=\"{{ togglePicker }}\" style=\"{{ pickerBtnStyle }}\">选择运动 ({{ pickedCount }})<\u002Fdiv>\n              <div style=\"margin-left:auto;display:flex;gap:14px;\">\n                <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#8A94A8;cursor:pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ includeHealth }}\" sc-camel-on-change=\"{{ toggleHealth }}\" style=\"accent-color:#4292E0;width:14px;height:14px;\">\n                  附带健康记录\n                <\u002Flabel>\n                <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#8A94A8;cursor:pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ includeHabits }}\" sc-camel-on-change=\"{{ toggleHabits }}\" style=\"accent-color:#4292E0;width:14px;height:14px;\">\n                  附带习惯记录\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ pickOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-height:180px;overflow-y:auto;border:1px solid #1C2739;border-radius:9px;margin-bottom:10px;background:#0B1220;\">\n                <sc-for list=\"{{ pickRows }}\" as=\"pk\" hint-placeholder-count=\"6\">\n                  <label style=\"display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #151E2E;font-size:12.5px;cursor:pointer;\">\n                    <input type=\"checkbox\" checked=\"{{ pk.checked }}\" sc-camel-on-change=\"{{ pk.toggle }}\" style=\"accent-color:#4292E0;width:14px;height:14px;\">\n                    <span style=\"color:#5C687E;font-family:ui-monospace,'SF Mono',Consolas,monospace;width:88px;\">{{ pk.date }}<\u002Fspan>\n                    <span style=\"flex:1;\">{{ pk.name }}<\u002Fspan>\n                    <span style=\"color:#8A94A8;\">{{ pk.type }}<\u002Fspan>\n                  <\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:10px;align-items:flex-end;\">\n              <textarea value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ onDraftKey }}\" rows=\"2\" placeholder=\"向 AI 提问,例如:分析我最近的有氧状态 / 帮我生成下周训练计划…\" style=\"flex:1;resize:none;background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;\"><\u002Ftextarea>\n              <button sc-camel-on-click=\"{{ sendMsg }}\" data-vc=\"btn-primary\" style=\"background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:14px;padding:11px 22px;border-radius:10px;cursor:pointer;flex-shrink:0;\">发送<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#5C687E;margin-top:8px;\">当前范围:{{ scopeSummary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ 连接器 ============ -->\n      <sc-if value=\"{{ tabConnectors }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"连接器\" style=\"animation:fadeUp .25s ease;max-width:1100px;margin:0 auto;\">\n          <div style=\"font-size:19px;font-weight:700;margin-bottom:4px;\">连接器<\u002Fdiv>\n          <div style=\"color:#8A94A8;font-size:13px;margin-bottom:20px;\">平台连接与数据同步 · 双账号按「开始时间 + 时长」自动合并去重,无法判定时需手动处理<\u002Fdiv>\n\n          <sc-if value=\"{{ hasConflicts }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:12px;background:rgba(224,160,64,.08);border:1px solid rgba(224,160,64,.4);border-radius:10px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;\">\n              <span style=\"color:#E0A040;font-size:15px;\">⚠<\u002Fspan>\n              <span style=\"font-size:13px;color:#E0A040;flex:1;min-width:200px;\">中国区与国际区发现 {{ conflictCount }} 组疑似重复运动,需要你确认保留哪一条<\u002Fspan>\n              <button sc-camel-on-click=\"{{ openConflicts }}\" style=\"background:#E0A040;border:none;color:#06101E;font-weight:700;font-size:12.5px;padding:8px 16px;border-radius:8px;cursor:pointer;\">处理重复 ({{ conflictCount }})<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div data-vc=\"connectors-grid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;\">\n            <sc-for list=\"{{ connectors }}\" as=\"cn\" hint-placeholder-count=\"2\">\n              <div data-vc=\"connector-card\" style=\"background:#121A28;border:1px solid #223049;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;\">\n                <div style=\"display:flex;align-items:center;gap:12px;\">\n                  <div style=\"width:38px;height:38px;border-radius:9px;background:#0B1220;border:1px solid #2A3A55;display:flex;align-items:center;justify-content:center;font-weight:700;color:#5EA3E8;font-size:13px;\">{{ cn.abbr }}<\u002Fdiv>\n                  <div style=\"flex:1;\">\n                    <div style=\"font-weight:600;font-size:15px;\">{{ cn.name }}<\u002Fdiv>\n                    <div style=\"color:#5C687E;font-size:12px;margin-top:2px;\">{{ cn.desc }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span data-vc=\"{{ cn.pillVc }}\" style=\"{{ cn.pillStyle }}\">{{ cn.statusText }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ cn.failed }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:rgba(224,96,96,.07);border:1px solid rgba(224,96,96,.35);border-radius:8px;padding:10px 12px;font-size:12px;color:#E06060;line-height:1.6;\">\n                    上次同步失败({{ cn.failTime }}):{{ cn.failReason }}\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;gap:20px;font-size:12px;color:#8A94A8;\">\n                  <div>上次成功同步<div style=\"color:#E6EBF4;font-size:13px;margin-top:3px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">{{ cn.last }}<\u002Fdiv><\u002Fdiv>\n                  <div>已同步运动<div style=\"color:#E6EBF4;font-size:13px;margin-top:3px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">{{ cn.count }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <label style=\"font-size:12px;color:#8A94A8;\">自动同步<\u002Flabel>\n                  <sc-raw-select value=\"{{ cn.auto }}\" sc-camel-on-change=\"{{ cn.onAuto }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:7px;padding:7px 10px;font-size:12px;\">\n                    <option value=\"30分钟\">每 30 分钟<\u002Foption>\n                    <option value=\"1小时\">每 1 小时<\u002Foption>\n                    <option value=\"6小时\">每 6 小时<\u002Foption>\n                    <option value=\"手动\">仅手动<\u002Foption>\n                  <\u002Fsc-raw-select>\n                  <div style=\"flex:1;\"><\u002Fdiv>\n                  <sc-if value=\"{{ cn.connected }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button sc-camel-on-click=\"{{ cn.doSync }}\" style=\"{{ cn.syncBtnStyle }}\">\n                      <sc-if value=\"{{ cn.syncing }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"display:inline-block;width:12px;height:12px;border:2px solid #06101E;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;\"><\u002Fspan>\n                      <\u002Fsc-if>\n                      {{ cn.syncLabel }}\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ cn.disconnected }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button sc-camel-on-click=\"{{ cn.doConnect }}\" style=\"background:transparent;border:1px solid #4292E0;color:#5EA3E8;font-size:13px;padding:8px 18px;border-radius:8px;cursor:pointer;\">连接账号<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"font-size:14px;font-weight:600;margin:20px 0 12px;\">文件上传<\u002Fdiv>\n          <div data-vc=\"upload-grid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;\">\n            <label style=\"display:block;border:1px dashed #3A4E70;border-radius:14px;padding:36px 24px;text-align:center;cursor:pointer;color:#8A94A8;font-size:13.5px;background:#0E1524;\">\n              <div style=\"font-size:26px;margin-bottom:8px;color:#4292E0;\">⇪<\u002Fdiv>\n              点击选择或拖入文件(可多选)\n              <div style=\"font-size:12px;color:#5C687E;margin-top:8px;\">支持 FIT / TCX / GPX,单个文件 ≤ 50 MB · 解析后入库到运动记录,来源标记为\"FIT上传\"<\u002Fdiv>\n              <input type=\"file\" multiple=\"\" accept=\".fit,.tcx,.gpx\" sc-camel-on-change=\"{{ onFitUpload }}\" style=\"display:none;\">\n            <\u002Flabel>\n            <div style=\"background:#121A28;border:1px solid #223049;border-radius:12px;overflow:hidden;align-self:start;\">\n              <div style=\"padding:13px 18px;border-bottom:1px solid #1C2739;font-size:13px;font-weight:600;\">已解析文件<\u002Fdiv>\n              <sc-for list=\"{{ fitFiles }}\" as=\"ff\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:center;gap:12px;font-size:12.5px;padding:10px 18px;border-bottom:1px solid #151E2E;\">\n                  <span style=\"color:#3FBF8F;\">✓<\u002Fspan>\n                  <span style=\"font-family:ui-monospace,'SF Mono',Consolas,monospace;color:#B8C2D4;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ ff.name }}<\u002Fspan>\n                  <span style=\"color:#5C687E;\">{{ ff.size }}<\u002Fspan>\n                  <span style=\"color:#5C687E;\">{{ ff.time }}<\u002Fspan>\n                  <span style=\"color:#3FBF8F;font-size:11px;background:rgba(63,191,143,.1);border:1px solid rgba(63,191,143,.3);border-radius:99px;padding:3px 10px;\">已入库<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ 设置 ============ -->\n      <sc-if value=\"{{ tabSettings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"设置\" data-vc=\"settings-page\" style=\"animation:fadeUp .25s ease;max-width:760px;margin:0 auto;\">\n          <div style=\"font-size:19px;font-weight:700;margin-bottom:18px;\">设置<\u002Fdiv>\n          <div data-vc=\"settings-group\" style=\"background:#121A28;border:1px solid #223049;border-radius:12px;padding:22px;margin-bottom:16px;\">\n            <div style=\"font-size:14px;font-weight:600;margin-bottom:16px;\">账户信息<\u002Fdiv>\n            <div data-vc=\"settings-account-grid\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">用户名<\u002Flabel>\n                <input value=\"{{ username }}\" sc-camel-on-change=\"{{ onUsername }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">昵称<\u002Flabel>\n                <input value=\"{{ nickname }}\" sc-camel-on-change=\"{{ onNickname }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">新密码<\u002Flabel>\n                <input type=\"password\" value=\"{{ newPwd }}\" sc-camel-on-change=\"{{ onNewPwd }}\" placeholder=\"留空则不修改\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">确认新密码<\u002Flabel>\n                <input type=\"password\" value=\"{{ newPwd2 }}\" sc-camel-on-change=\"{{ onNewPwd2 }}\" placeholder=\"再次输入\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ saveAccount }}\" style=\"margin-top:16px;background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:13px;padding:10px 22px;border-radius:8px;cursor:pointer;\">保存账户<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"background:#121A28;border:1px solid #223049;border-radius:12px;padding:22px;margin-bottom:16px;\">\n            <div style=\"font-size:14px;font-weight:600;margin-bottom:16px;\">单位制<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:14px;\">\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n                <span style=\"font-size:12px;color:#8A94A8;width:90px;\">距离 / 海拔<\u002Fspan>\n                <sc-for list=\"{{ unitSystemChips }}\" as=\"uc\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ uc.pick }}\" style=\"{{ uc.style }}\">{{ uc.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n                <span style=\"font-size:12px;color:#8A94A8;width:90px;\">配速<\u002Fspan>\n                <sc-for list=\"{{ paceUnitChips }}\" as=\"uc\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ uc.pick }}\" style=\"{{ uc.style }}\">{{ uc.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;\">\n                <span style=\"font-size:12px;color:#8A94A8;width:90px;\">体重<\u002Fspan>\n                <sc-for list=\"{{ weightUnitChips }}\" as=\"uc\" hint-placeholder-count=\"2\">\n                  <div sc-camel-on-click=\"{{ uc.pick }}\" style=\"{{ uc.style }}\">{{ uc.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#121A28;border:1px solid #223049;border-radius:12px;padding:22px;margin-bottom:16px;\">\n            <div style=\"font-size:14px;font-weight:600;margin-bottom:4px;\">区间设定<\u002Fdiv>\n            <div style=\"font-size:12px;color:#5C687E;margin-bottom:16px;\">仅作为原始数据的标注边界(如详情页心率区间图);AI 分析时随数据一并附带,系统不用它计算任何指标<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:16px;\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">最大心率 bpm<\u002Flabel>\n                <input value=\"{{ zMaxHr }}\" sc-camel-on-change=\"{{ onZMaxHr }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">LTHR bpm<\u002Flabel>\n                <input value=\"{{ zLthr }}\" sc-camel-on-change=\"{{ onZLthr }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">FTP W<\u002Flabel>\n                <input value=\"{{ zFtp }}\" sc-camel-on-change=\"{{ onZFtp }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12px;color:#8A94A8;margin-bottom:8px;\">心率区间上界 bpm(Z5 上界为最大心率)<\u002Fdiv>\n            <div data-vc=\"settings-zone-grid\" style=\"{{ zoneGridStyle }}\">\n              <sc-for list=\"{{ zoneInputs }}\" as=\"zi\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <label style=\"font-size:12px;color:#8A94A8;\">{{ zi.label }}<\u002Flabel>\n                  <input value=\"{{ zi.val }}\" sc-camel-on-change=\"{{ zi.onChange }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ saveZones }}\" style=\"margin-top:16px;background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:13px;padding:10px 22px;border-radius:8px;cursor:pointer;\">保存区间<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"background:#121A28;border:1px solid #223049;border-radius:12px;padding:22px;\">\n            <div style=\"font-size:14px;font-weight:600;margin-bottom:4px;\">AI 接口(OpenAI 兼容)<\u002Fdiv>\n            <div style=\"font-size:12px;color:#5C687E;margin-bottom:16px;\">参照 DeepSeek 官方接入方式:base_url + API Key + 模型名称<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:14px;\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">API 地址(base_url)<\u002Flabel>\n                <input value=\"{{ apiBase }}\" sc-camel-on-change=\"{{ onApiBase }}\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">API Key<\u002Flabel>\n                <input type=\"password\" value=\"{{ apiKey }}\" sc-camel-on-change=\"{{ onApiKey }}\" placeholder=\"sk-…\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <label style=\"font-size:12px;color:#8A94A8;\">模型名称<\u002Flabel>\n                <input value=\"{{ model }}\" sc-camel-on-change=\"{{ onModel }}\" list=\"model-list\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n                <datalist id=\"model-list\">\n                  <option value=\"deepseek-chat\"><\u002Foption>\n                  <option value=\"deepseek-reasoner\"><\u002Foption>\n                <\u002Fdatalist>\n                <div style=\"font-size:11px;color:#5C687E;\">deepseek-chat(通用)/ deepseek-reasoner(推理);也可填其它兼容模型名<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <div style=\"display:flex;align-items:center;gap:10px;\">\n                  <label style=\"font-size:12px;color:#8A94A8;\">内置系统提示词(每次对话隐藏发送,强制 AI 以 HTML 回复)<\u002Flabel>\n                  <button sc-camel-on-click=\"{{ togglePrompt }}\" style=\"background:transparent;border:1px solid #2A3A55;color:#5EA3E8;font-size:11px;padding:4px 12px;border-radius:6px;cursor:pointer;\">{{ promptToggleLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n                <sc-if value=\"{{ promptOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:#0B1220;border:1px solid #1C2739;border-radius:8px;padding:12px 14px;font-size:12px;color:#8A94A8;line-height:1.9;font-family:ui-monospace,'SF Mono',Consolas,monospace;white-space:pre-wrap;\">{{ sysPrompt }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:center;\">\n                <button sc-camel-on-click=\"{{ testApi }}\" style=\"background:transparent;border:1px solid #4292E0;color:#5EA3E8;font-size:13px;padding:9px 20px;border-radius:8px;cursor:pointer;\">\n                  <sc-if value=\"{{ testing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"display:inline-block;width:11px;height:11px;border:2px solid #5EA3E8;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:6px;\"><\u002Fspan>\n                  <\u002Fsc-if>\n                  测试连接并识别模型\n                <\u002Fbutton>\n                <span style=\"font-size:12px;color:#3FBF8F;\">{{ apiTestResult }}<\u002Fspan>\n                <div style=\"flex:1;\"><\u002Fdiv>\n                <button sc-camel-on-click=\"{{ saveApi }}\" style=\"background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:13px;padding:10px 22px;border-radius:8px;cursor:pointer;\">保存配置<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 连接器登录弹窗 -->\n<sc-if value=\"{{ cmShow }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ cmCancel }}\" style=\"{{ modalOverlayStyle }}\">\n    <div sc-camel-on-click=\"{{ stopClick }}\" data-vc=\"modal-connector-auth\" style=\"{{ cmPanelStyle }}\">\n      <div style=\"font-size:16px;font-weight:700;margin-bottom:4px;\">连接 {{ cmTitle }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#5C687E;margin-bottom:18px;\">使用该平台的账号授权,授权后将定时同步数据<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:13px;\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-size:12px;color:#8A94A8;\">账号(邮箱 / 手机号)<\u002Flabel>\n          <input value=\"{{ cmUser }}\" sc-camel-on-change=\"{{ cmOnUser }}\" placeholder=\"请输入平台账号\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-size:12px;color:#8A94A8;\">密码<\u002Flabel>\n          <input type=\"password\" value=\"{{ cmPass }}\" sc-camel-on-change=\"{{ cmOnPass }}\" placeholder=\"请输入平台密码\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:13px;\">\n        <\u002Fdiv>\n        <label style=\"display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8A94A8;cursor:pointer;\">\n          <input type=\"checkbox\" checked=\"{{ cmUse2fa }}\" sc-camel-on-change=\"{{ cmToggle2fa }}\" disabled=\"{{ cmCodeStage }}\" style=\"accent-color:#4292E0;width:14px;height:14px;\">\n          该账号启用了两步验证(2FA)\n        <\u002Flabel>\n        <sc-if value=\"{{ cmCodeStage }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;background:rgba(66,146,224,.07);border:1px solid rgba(66,146,224,.3);border-radius:10px;padding:12px;\">\n            <label style=\"font-size:12px;color:#5EA3E8;\">已向你的设备发送验证码,请输入 2FA 验证码后再次点击登录<\u002Flabel>\n            <input value=\"{{ cmCode }}\" sc-camel-on-change=\"{{ cmOnCode }}\" placeholder=\"6 位验证码\" sc-camel-max-length=\"6\" style=\"background:#0B1220;border:1px solid #2A3A55;color:#E6EBF4;border-radius:8px;padding:10px 12px;font-size:15px;letter-spacing:6px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cmErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#E06060;font-size:12px;\">{{ cmErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:10px;margin-top:4px;\">\n          <button sc-camel-on-click=\"{{ cmCancel }}\" style=\"flex:1;background:transparent;border:1px solid #2A3A55;color:#8A94A8;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;\">取消<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ cmLogin }}\" style=\"flex:2;background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:14px;padding:10px;border-radius:8px;cursor:pointer;\">\n            <sc-if value=\"{{ cmBusy }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"display:inline-block;width:12px;height:12px;border:2px solid #06101E;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px;\"><\u002Fspan>\n            <\u002Fsc-if>\n            {{ cmBtnLabel }}\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- 重复运动处理弹窗 -->\n<sc-if value=\"{{ conflictOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeConflicts }}\" style=\"{{ modalOverlayStyle }}\">\n    <div sc-camel-on-click=\"{{ stopClick }}\" data-vc=\"modal-conflict\" style=\"{{ conflictPanelStyle }}\">\n      <div style=\"font-size:16px;font-weight:700;margin-bottom:4px;\">处理重复运动<\u002Fdiv>\n      <div style=\"font-size:12px;color:#5C687E;margin-bottom:18px;\">以下运动在中国区与国际区同时存在(开始时间 + 时长一致),请选择保留哪一条,另一条将被忽略<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:18px;\">\n        <sc-for list=\"{{ conflictRows }}\" as=\"cf\" hint-placeholder-count=\"2\">\n          <div style=\"background:#0B1220;border:1px solid #1C2739;border-radius:10px;padding:14px 16px;\">\n            <div style=\"display:flex;gap:10px;font-size:13px;margin-bottom:10px;align-items:center;flex-wrap:wrap;\">\n              <span style=\"font-weight:600;\">{{ cf.name }}<\u002Fspan>\n              <span style=\"color:#5C687E;font-size:12px;font-family:ui-monospace,'SF Mono',Consolas,monospace;\">{{ cf.date }} · {{ cf.dist }} · {{ cf.dur }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n              <div sc-camel-on-click=\"{{ cf.pickCn }}\" style=\"{{ cf.cnStyle }}\">保留中国区 <span style=\"color:#5C687E;font-size:11px;margin-left:6px;\">connect.garmin.cn<\u002Fspan><\u002Fdiv>\n              <div sc-camel-on-click=\"{{ cf.pickIntl }}\" style=\"{{ cf.intlStyle }}\">保留国际区 <span style=\"color:#5C687E;font-size:11px;margin-left:6px;\">connect.garmin.com<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;\">\n        <button sc-camel-on-click=\"{{ closeConflicts }}\" style=\"flex:1;background:transparent;border:1px solid #2A3A55;color:#8A94A8;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;\">稍后处理<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resolveConflicts }}\" style=\"flex:2;background:#4292E0;border:none;color:#06101E;font-weight:700;font-size:14px;padding:10px;border-radius:8px;cursor:pointer;\">确认合并<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1A2436;border:1px solid #3A4E70;color:#E6EBF4;font-size:13px;padding:11px 22px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:99;animation:fadeUp .25s ease;\" data-vc=\"toast\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: 900}, &quot;layout&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;顶部导航&quot;, &quot;侧边导航&quot;], &quot;default&quot;: &quot;顶部导航&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;布局&quot;}, &quot;skipLogin&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;调试&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.TODAY = new Date('2026-07-09');\n    const wd = ['周日','周一','周二','周三','周四','周五','周六'];\n    this.dstr = (off) => {\n      const d = new Date(this.TODAY); d.setDate(d.getDate() - off);\n      return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + wd[d.getDay()];\n    };\n    this.iso = (off) => {\n      const d = new Date(this.TODAY); d.setDate(d.getDate() - off);\n      return d.toISOString().slice(0, 10);\n    };\n    this.typeColors = {'跑步':'#4292E0','骑行':'#3FBF8F','游泳':'#3FB8BF','力量':'#E0A040','越野跑':'#9B7BE0'};\n\n    // ---------- 运动数据(近180天,含分页量级) ----------\n    const acts = [];\n    let seq = 0;\n    const mkRun = (off, name, dist, paceSec, aHr, mHr, elev, src, type) => acts.push({\n      id: 'a' + (seq++), off, type: type || '跑步', name, dist, paceSec,\n      durSec: Math.round(dist * paceSec), aHr, mHr, elev, cal: Math.round(dist * 64),\n      cad: Math.round(170 + (paceSec < 300 ? 12 : 4)), src\n    });\n    const mkRide = (off, name, dist, kmh, pwr, aHr, mHr, elev, src) => acts.push({\n      id: 'a' + (seq++), off, type: '骑行', name, dist, kmh, pwr,\n      durSec: Math.round(dist / kmh * 3600), aHr, mHr, elev,\n      cal: Math.round(dist / kmh * 620), cad: Math.round(82 + kmh / 4), src\n    });\n    const mkSwim = (off, name, dist, pace100, aHr, mHr, src) => acts.push({\n      id: 'a' + (seq++), off, type: '游泳', name, dist, pace100,\n      durSec: Math.round(dist * 10 * pace100), aHr, mHr, elev: 0,\n      cal: Math.round(dist * 220), cad: 30, src\n    });\n    const mkStr = (off, name, durMin, aHr, mHr, cal, src) => acts.push({\n      id: 'a' + (seq++), off, type: '力量', name, dist: null,\n      durSec: durMin * 60, aHr, mHr, elev: 0, cal, cad: null, src\n    });\n    // 近期精选\n    mkRun(0, '晨间轻松跑', 5.08, 371, 152, 170, 2, '佳明CN');\n    mkRide(1, '间歇功率课', 45.3, 29.5, 212, 151, 176, 420, '佳明CN');\n    mkSwim(2, '泳池有氧', 2.0, 145, 128, 145, '佳明国际');\n    mkStr(3, '下肢力量', 55, 112, 139, 320, '佳明CN');\n    mkRun(4, '山地越野', 15.6, 456, 149, 171, 860, '佳明国际', '越野跑');\n    mkRun(5, '节奏跑 6×1km', 12.1, 292, 156, 172, 84, '佳明CN');\n    mkRide(7, '有氧耐力骑', 78.4, 28.5, 186, 138, 162, 640, '佳明CN');\n    mkRun(9, '长距离慢跑', 21.1, 320, 145, 160, 210, '佳明CN');\n    mkSwim(11, '技术课', 1.5, 160, 120, 138, '佳明国际');\n    mkRun(14, '恢复跑', 6.0, 340, 128, 141, 40, 'FIT上传');\n    // 程序化生成(近180天)\n    const rnd = this.seeded(7);\n    const runNames = ['轻松跑','有氧跑','间歇训练','节奏跑','长距离跑','渐加速跑','恢复跑'];\n    const rideNames = ['有氧骑行','间歇骑','长途骑行','恢复骑','爬坡训练'];\n    const swimNames = ['泳池训练','有氧游','技术课'];\n    const strNames = ['力量训练','核心训练','上肢力量'];\n    const trailNames = ['越野跑','山地越野','丘陵越野'];\n    let off = 16;\n    while (off < 180) {\n      const r = rnd();\n      const src = rnd() < 0.72 ? '佳明CN' : (rnd() < 0.7 ? '佳明国际' : 'FIT上传');\n      if (r < 0.42) mkRun(off, runNames[Math.floor(rnd()*runNames.length)], +(5 + rnd()*17).toFixed(2), Math.round(280 + rnd()*70), Math.round(130 + rnd()*28), Math.round(150 + rnd()*28), Math.round(rnd()*220), src);\n      else if (r < 0.65) mkRide(off, rideNames[Math.floor(rnd()*rideNames.length)], +(30 + rnd()*70).toFixed(1), +(26 + rnd()*7).toFixed(1), Math.round(170 + rnd()*70), Math.round(130 + rnd()*26), Math.round(155 + rnd()*28), Math.round(200 + rnd()*900), src);\n      else if (r < 0.78) mkSwim(off, swimNames[Math.floor(rnd()*swimNames.length)], +(1 + rnd()*2).toFixed(1), Math.round(135 + rnd()*35), Math.round(115 + rnd()*20), Math.round(135 + rnd()*18), src);\n      else if (r < 0.9) mkStr(off, strNames[Math.floor(rnd()*strNames.length)], Math.round(35 + rnd()*30), Math.round(100 + rnd()*20), Math.round(125 + rnd()*20), Math.round(220 + rnd()*160), src);\n      else mkRun(off, trailNames[Math.floor(rnd()*trailNames.length)], +(9 + rnd()*10).toFixed(1), Math.round(420 + rnd()*80), Math.round(140 + rnd()*16), Math.round(162 + rnd()*16), Math.round(400 + rnd()*700), src, '越野跑');\n      off += 1 + Math.floor(rnd() * 3);\n    }\n    acts.forEach(a => { a.date = this.dstr(a.off); });\n    this.acts = acts;\n    // a0 = 真实 FIT 文件(614797758_ACTIVITY.fit)解析出的原始数据\n    Object.assign(this.acts[0], { durSec: 1887, cal: 344, real: {\n      moving: '31:22', elapsed: '32:28',\n      avgPace: \"6'11\\\"/km\", bestPace: \"5'33\\\"/km\",\n      avgPower: '265 W', maxPower: '310 W', np: '264 W',\n      stepLen: '0.92 m', vosc: '8.1 cm', vratio: '8.8 %', gct: '265 ms',\n      te: '2.7(有氧基础)', ate: '0.0', load: '65',\n      descent: '4 m', minElev: '494 m', maxElev: '498 m',\n      tempAvg: '32.0 °C', tempMin: '31.0 °C', tempMax: '33.0 °C',\n      calAct: '300 kcal', calRest: '44 kcal', calTot: '344 kcal',\n      feel: '正常', rpe: '3/10',\n      ciqDist: '5043.0 m', ciqCad: '174.9 spm', ciqGct: '265.6 ms', ciqVosc: '7.0 cm',\n      ciqPwr: '247.1 W', ciqLss: '4.56 kn/m', ciqVilr: '39.5 bw/s', ciqPif: '17.6 g'\n    } });\n    this.SYS_PROMPT = '你是专业的耐力训练数据分析师。规则:\\n1. 始终以 HTML 片段回复(仅内联样式),以便在对话框中直接渲染 — 数据对比用 <table>,计划/流程用列表或表格,趋势用系统图表卡片,图片用占位说明;\\n2. 仅基于系统随对话附带的原始数据(运动记录 / 健康记录 / 习惯记录)进行分析,不得编造数据;\\n3. TSS、训练负荷等衍生指标由你计算并注明计算依据,系统不预先计算;\\n4. 中文回复,专业指标可用英文缩写(HRV、NP、GAP 等)。';\n\n    // ---------- 健康数据(近90天) ----------\n    const hrnd = this.seeded(42);\n    this.sleepDays = Array.from({length: 90}, (_, i) => {\n      const o = 89 - i;\n      return { off: o, date: this.dstr(o), deep: +(1.1 + hrnd()*0.9).toFixed(1), light: +(3.4 + hrnd()*1.2).toFixed(1), rem: +(1.0 + hrnd()*0.9).toFixed(1), rhr: Math.round(44 + hrnd()*8) };\n    });\n    this.weights = Array.from({length: 90}, (_, i) => {\n      const o = 89 - i;\n      return { off: o, date: this.dstr(o), kg: +(69.2 - i*0.008 + (hrnd()-0.5)*0.5).toFixed(1), fat: +(14.5 + (hrnd()-0.5)*1.2).toFixed(1), muscle: +(54.2 + (hrnd()-0.5)*0.6).toFixed(1), water: +(58.5 + (hrnd()-0.5)*1.5).toFixed(1) };\n    });\n    this.hrvDays = Array.from({length: 90}, (_, i) => {\n      const o = 89 - i;\n      const avg = Math.round(52 + Math.sin(i/4)*7 + (hrnd()-0.5)*8);\n      const rhr = Math.round(44 + hrnd()*7);\n      return { off: o, date: this.dstr(o), avg, max: avg + Math.round(8 + hrnd()*10), rhr, minHr: rhr - Math.round(3 + hrnd()*4) };\n    });\n\n    // ---------- 习惯分组 ----------\n    this.habitGroupsDef = [\n      { id: 'morning', label: '早上', color: '#E0A040', items: ['咖啡','轻量运动','中度运动','重度运动','看书','冥想','拉伸','高蛋白早餐','空腹训练'] },\n      { id: 'noon', label: '中午', color: '#4292E0', items: ['午睡','咖啡','外食','散步','奶茶/甜品','轻量运动'] },\n      { id: 'evening', label: '晚上', color: '#9B7BE0', items: ['看书','拉伸','泡脚','冥想','酒精','熬夜(>23:30)','长时间屏幕','宵夜'] },\n      { id: 'allday', label: '全天', color: '#3FBF8F', items: ['补水充足','高蛋白饮食','补剂(镁/维D)','久坐','压力大','户外日晒'] }\n    ];\n  }\n\n  seeded(s) { let x = s; return () => { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }\n\n  optChip(on) {\n    return {\n      padding: '7px 16px', borderRadius: '99px', cursor: 'pointer', fontSize: '12.5px', userSelect: 'none',\n      background: on ? 'rgba(66,146,224,.16)' : '#0B1220',\n      color: on ? '#5EA3E8' : '#8A94A8',\n      border: '1px solid ' + (on ? '#4292E0' : '#2A3A55')\n    };\n  }\n  conflictOptStyle(on) {\n    return {\n      padding: '9px 14px', borderRadius: '8px', cursor: 'pointer', fontSize: '12.5px', flex: 1, minWidth: '180px', userSelect: 'none',\n      background: on ? 'rgba(66,146,224,.16)' : '#121A28',\n      color: on ? '#5EA3E8' : '#8A94A8',\n      border: '1px solid ' + (on ? '#4292E0' : '#2A3A55')\n    };\n  }\n\n  fmtDur(sec) {\n    sec = Math.round(sec);\n    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;\n    return h ? h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') : m + ':' + String(s).padStart(2,'0');\n  }\n  fmtPace(sec) {\n    sec = Math.
