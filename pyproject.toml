[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlab"
version = "0.1.0"
description = "Model-independent Agent Harness for Apple Health and workout analysis"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.5",
  "fitdecode==0.11.0",
  "garminconnect==0.3.6",
  "jsonschema==4.25.1",
  "openpyxl==3.1.5",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==6.2.1"]

[project.scripts]
trainlab = "trainlab.cli:main"
trainlab-gmail-mcp = "trainlab.gmail_mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
