[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "trainlab"
version = "0.1.0"
description = "Local-first Garmin training analysis, mail agent, and supervised orchestration"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.5",
  "fitdecode==0.11.0",
  "garminconnect==0.3.6",
  "jsonschema==4.25.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.16.1",
]

[project.scripts]
trainlab = "trainlab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trainlab.email_templates.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
